non_operation_routes:
- route: PATCH|PUT /ngsi-ld/v1/entities
  handler: crates/antares-api/src/lib.rs:1331 missing_entity_id
  answer: 400 BadRequestData, no store access, no gate
  needs_row_because: reachable route that is not an operation
- route: OPTIONS any /ngsi-ld/v1 route, HEAD on every GET
  handler: axum MethodRouter + conformance layer (lib.rs comment above API_ROOT nest)
  answer: OPTIONS 204 + Allow; HEAD = the GET operation, same gate
  needs_row_because: method variants
- route: POST /ex/v1/remote-notify
  handler: crates/antares-api/src/distsub.rs:855 remote_notify
  answer: 'peer-facing: notification of a forwarded subscription copy, remapped to the original subscriber; no on_request
    gate; the remapped delivery passes pre_notify (unknown: not traced in this analysis)'
  needs_row_because: writes broker state without an NGSI-LD operation (ADR-0019)
- route: /q/health, /q/ready, /q/metrics, /q/tenants, /q/tenants/{tenant}, /q/dead-letters, /q/dead-letters/{id},
    /q/dead-letters/{id}/replay
  handler: crates/antares-api/src/lib.rs:230 Admin::router
  answer: 'outside the seam by ADR-0020 (''/q is outside the seam: the admin surface is the gateway''s to protect'');
    no surface may proxy to /q'
  needs_row_because: reachable through AppState::call unless the surfaces refuse /q
- route: MCP describe_access
  handler: 'joinedcontext-platform crates/context-gateway/src/mcp/endpoint_facade.rs:257 (operations: none)'
  answer: 'proposal: answered from the Filter of a 10.4.3 gate, never from the engine''s rule text'
  needs_row_because: existing platform tool with no NGSI-LD operation
- route: MCP describe_schema
  handler: endpoint_facade.rs:275 (operations QueryEntity, RetrieveEntity, RetrieveEntityTypes)
  answer: 'maps to the LinkML surface: 10.6.4 + 10.6.7 under the view'
  needs_row_because: existing platform tool spanning three operations
- route: MCP list_endpoints (hub)
  handler: joinedcontext-platform crates/context-gateway/src/mcp/hub.rs:447
  answer: 'platform-side endpoint directory, not a broker operation: stays in the platform (T-3436 decides)'
  needs_row_because: existing platform tool
- route: MCP initialize, tools/list, ping (protocol methods)
  handler: joinedcontext-platform crates/context-gateway/src/mcp/server.rs
  answer: protocol only; tools/list lists only tools whose operation the view allows (proposal)
  needs_row_because: protocol methods
