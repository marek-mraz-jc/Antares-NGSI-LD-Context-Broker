[package]
name = "antares-icsr"
description = "Internal context sources: a registration that names this broker is served in process, under the target Tenant's export grant and engine (ADR-0025)."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

# ADR-0027 section 2, surfaces-threat-model 9.3: checked by dev/check-module-rules.py.
# `url` is the parser the HTTP client normalises a forward's target with, so a
# self URL and a target compare in one form.
[package.metadata.antares]
role = "surface"
feature = "internal-csr"

[dependencies]
antares-ops = { workspace = true }
axum = { version = "0.8", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
url = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
antares-ops = { workspace = true, features = ["test-kit"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
http-body-util = { version = "0.1", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { workspace = true }

[[bench]]
name = "forward"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
