"id": "https://example.org/building"
"name": "building"
"version": "1.2.0"
"imports":
  - "linkml:types"
"default_range": "string"
"prefixes":
  "bld":
    "prefix_prefix": "bld"
    "prefix_reference": "https://example.org/building#"
  "schema":
    "prefix_prefix": "schema"
    "prefix_reference": "https://schema.org/"
  "unece":
    "prefix_prefix": "unece"
    "prefix_reference": "http://purl.oclc.org/NET/ssnx/qu/unit#"
"default_prefix": "bld"
"classes":
  "Asset":
    "name": "Asset"
    "slots":
      - "name"
      - "status"
    "description": "Anything the building operator tracks."
  "Room":
    "class_uri": "schema:Room"
    "is_a": "Asset"
    "slots":
      - "temperature"
      - "floor"
      - "sensors"
    "slot_usage":
      "name":
        "required": true
        "description": "The room's \"label\"."
    "description": "A room | with a pipe and *stars*."
  "Sensor":
    "is_a": "Asset"
    "slots":
      - "location"
"slots":
  "floor":
    "range": "integer"
    "required": true
  "location":
    "range": "Room"
    "inlined": false
    "description": "Where the sensor hangs.\nSecond line."
  "name":
    "name": "name"
    "slot_uri": "schema:name"
    "range": "string"
  "sensors":
    "range": "Sensor"
    "multivalued": true
    "inverse": "location"
  "status":
    "range": "Status"
  "temperature":
    "range": "float"
    "unit":
      "ucum_code": "Cel"
      "symbol": "°C"
      "exact_mappings":
        - "unece:CEL"
    "annotations":
      "ngsi_ld_kind":
        "tag": "ngsi_ld_kind"
        "value": "Property"
"enums":
  "Status":
    "description": "Operating state."
    "permissible_values":
      "active":
        "text": "active"
        "meaning": "bld:Active"
      "retired":
        "description": "Out of service."
