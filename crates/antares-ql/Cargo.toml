[package]
name = "ngsild-ql"
description = "NGSI-LD query language parsers (q=, scopeQ, geoQ) -> typed AST. Publishable as ngsild-ql."
version.workspace = true
edition.workspace = true
publish = ["crates-io"]
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
# reads the vendored ETSI suite, which is not in the package
exclude = ["tests/etsi_fixtures.rs"]
keywords = ["ngsi-ld", "etsi", "query-language", "geospatial", "fiware"]
categories = ["parser-implementations", "science::geo"]

# ADR-0027 / surfaces-threat-model 9.1: checked by dev/check-module-rules.py.
[package.metadata.antares]
role = "ngsild"

[dependencies]
antares-jsonld = { workspace = true }
antares-model = { workspace = true }
geo = { workspace = true }
geo-types = { workspace = true }
geojson = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
