[package]
name = "odata-batch"
description = "OData 4.01 $batch: multipart/mixed and JSON batch parsers over a bounded byte slice, response writers, dependsOn checking."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

# ADR-0024 decision 1 / surfaces-threat-model 9.1: checked by dev/check-module-rules.py.
[package.metadata.antares]
role = "protocol"

[dependencies]
memchr = { version = "2", default-features = false, features = ["std"] }
# float_roundtrip: a number in a member body reaches the member's reader with the same bits
# (found by tests/props.rs); odata-json reads it the same way.
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }

[dev-dependencies]
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
