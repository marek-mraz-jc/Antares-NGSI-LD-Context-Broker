[package]
name = "antares-ws"
description = "The WebSocket notification channel: /x/ws/ngsi-ld/v1 and /x/views/{view}/ws, the TS 104 243 envelope, a minted endpoint, a bounded queue and resume (ADR-0026)."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

# ADR-0027 section 2, surfaces-threat-model 9.3: checked by dev/check-module-rules.py.
# The WebSocket protocol is tokio-tungstenite, the protocol dependency of this
# surface, on the connection hyper upgrades. Never axum's `ws` feature: cargo
# unifies a feature across the workspace, so it would put tungstenite into
# every build's axum, the vanilla broker's audit list included (T-3704).
[package.metadata.antares]
role = "surface"
feature = "ws"

[dependencies]
antares-ops = { workspace = true }
axum = { version = "0.8", default-features = false }
data-encoding = { version = "2", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = { version = "0.3", default-features = false }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
antares-ops = { workspace = true, features = ["test-kit"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
# the tests read docs/api/asyncapi-ws.yaml, the published contract (T-3518)
regex = { workspace = true }
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { workspace = true }

[[bench]]
name = "fanout"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
