[package]
name = "odata-csdl"
description = "OData 4.01 EDM model with CSDL XML and CSDL JSON writers and model validation."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

# ADR-0024 decision 1 / surfaces-threat-model 9.1: checked by dev/check-module-rules.py.
[package.metadata.antares]
role = "protocol"

[dependencies]
# CSDL XML 15.2 identifier classes (\p{L}, \p{Nl}, \p{Nd}, \p{Mn}, \p{Mc}, \p{Pc}, \p{Cf}).
regex = { version = "1", default-features = false, features = ["std", "unicode-gencat"] }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { version = "1", default-features = false, features = ["std"] }

[[bench]]
name = "metadata"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
