[package]
name = "antares-ogc"
description = "The OGC API - Features surface of a view: /x/views/{view}/ogc/features, collections from the Tenant's LinkML schema intersected with the view, Features from its Query and Retrieve Entity answers (T-3744, ADR-0029)."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

# ADR-0027 section 2, surfaces-threat-model 9.3: checked by dev/check-module-rules.py.
[package.metadata.antares]
role = "surface"
feature = "ogc"
protocols = ["linkml-model", "ogc-cql2", "antares-export"]

[features]
# T-4465: items as Apache Parquet and GeoParquet 1.1.
parquet = ["dep:antares-export", "antares-export/parquet", "dep:chrono"]
# T-4477: items as CSV and XLSX, /collections as an XLSX or a ZIP bundle.
tabular = ["dep:antares-export", "antares-export/csv", "antares-export/xlsx", "antares-export/zip", "dep:chrono"]

[dependencies]
antares-ops = { workspace = true }
antares-export = { workspace = true, optional = true }
axum = { version = "0.8", default-features = false, features = ["query"] }
# a file's provenance names when it was written (T-4477)
chrono = { version = "0.4", default-features = false, features = ["clock", "std"], optional = true }
linkml-model = { path = "../linkml-model" }
ogc-cql2 = { path = "../ogc-cql2" }
serde_json = { version = "1", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["v4"] }

[dev-dependencies]
antares-ops = { workspace = true, features = ["test-kit"] }
bytes = { version = "1", default-features = false }
parquet = { version = "60", default-features = false, features = ["zstd"] }
http-body-util = { version = "0.1", default-features = false }
# the tabular tests read the workbooks and bundles back
zip = { version = "9.0.1", default-features = false, features = ["deflate"] }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

# surfaces-threat-model 10.1: the full table, not the workspace's.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
