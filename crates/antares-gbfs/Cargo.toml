[package]
name = "antares-gbfs"
description = "the bike-hire docking stations of a view as a GBFS 3.0 feed: `gbfs.json`, `system_information.json`, `station_information.json` and `station_status.json`."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

# ADR-0027 section 2, surfaces-threat-model 9.3: checked by dev/check-module-rules.py.
# Generated by dev/new-surface.py (docs/src/new-surface.md).
[package.metadata.antares]
role = "surface"
feature = "gbfs"
protocols = []

[dependencies]
antares-ops = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["query"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
metrics = { version = "0.24", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

[dev-dependencies]
antares-ops = { workspace = true, features = ["test-kit"] }
http-body-util = { version = "0.1", default-features = false }
tokio = { version = "1", default-features = false, features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

# surfaces-threat-model 10.1: the full table, not the workspace's.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
