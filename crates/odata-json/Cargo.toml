[package]
name = "odata-json"
description = "OData 4.01 JSON format: entity, collection, reference, service-document and error writers, context URLs, the write-body reader, Prefer and version negotiation."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
rust-version.workspace = true

# ADR-0024 decision 1 / surfaces-threat-model 9.1: checked by dev/check-module-rules.py.
[package.metadata.antares]
role = "protocol"

[dependencies]
odata-csdl = { path = "../odata-csdl" }
odata-url = { path = "../odata-url", features = ["edm"] }
serde = { version = "1", default-features = false, features = ["std"] }
# float_roundtrip: an Edm.Double reads back to the same bits (found by tests/props.rs).
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }

[dev-dependencies]
proptest = { workspace = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
