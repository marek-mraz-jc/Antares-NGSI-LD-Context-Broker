# The NGSI-LD API: `antares_api::api_routes()` (crates/antares-api/src/lib.rs) is the
# one table `router()` nests under API_ROOT, one `("path", get(h).post(h2)...)` tuple
# per path. One endpoint per method; HEAD is axum's own twin of every GET and is not
# written in the source, so it has no endpoint here (69 methods, 92 with HEAD).
[[link]]
name = "api-routes"
channel = "http"
role = "provides"
files = ["crates/antares-api/src/lib.rs"]
pattern = '(?s)\(\s*"(?P<key>/[^"]+)"\s*,(?P<body>.*?)\)\s*,?\s*\)'
each = '(?P<verb>get|post|put|patch|delete)\(\s*(?P<symbol>[\w:]+)'
key = "{verb} {key}"
prefix = "/ngsi-ld/v1"
# /ex/v1/remote-notify is mounted outside the API nest: pinned in admin.toml
skip = ['^/ex/']
