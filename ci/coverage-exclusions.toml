# Lines and branches of the surfaces epic's new crates that no test covers, and why
# (surfaces-test-plan section 1, dev/coverage-gate.py). One entry per function:
#
# [[exclusion]]
# crate = "antares-ops"                 # the package name
# file = "src/parse.rs"                 # relative to the crate's folder
# function = "antares_ops::parse::depth" # the Rust path of the function
# lines = 1                             # uncovered lines in it
# branches = 1                          # uncovered branch sides in it
# reason = "unreachable after a checked conversion the type system cannot see"
#
# The gate is red when a crate is below 100 % minus what is listed, and when an entry's function
# is gone or its counts differ from what is measured, so a fixed gap must leave this file too.

[[exclusion]]
crate = "antares-ops"
file = "src/lib.rs"
function = "Ops::run" # v0 mangling puts the impl between the crate and the type
lines = 6
branches = 1
reason = "a 503 comes from a store whose pool timed out (DB_OVERLOADED); the built-in store under test_kit has no pool, and the broker's own tests cover the 503 through their pool-wall driver"

[[exclusion]]
crate = "antares-ops"
file = "src/lib.rs"
function = "antares_ops::inner_failure"
lines = 2
branches = 0
reason = "tracing::warn! repeats the fields in its `log` fallback, which runs only with no subscriber set; ops_errors covers the subscriber path and asserts what it logs"

[[exclusion]]
crate = "antares-ops"
file = "src/views.rs"
function = "antares_ops::views::inner"
lines = 8
branches = 0
reason = "the view store failing: the built-in store under test_kit does not fail, and antares-ops may not name the store to put one that does in its place (module rule M2)"

[[exclusion]]
crate = "antares-ops"
file = "src/views.rs"
function = "Reloader::reload_or_log" # v0 mangling puts the impl between the crate and the type
lines = 3
branches = 1
reason = "the periodic reload failing on the store, which the built-in store does not (see antares_ops::views::inner)"
