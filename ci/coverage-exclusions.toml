lines = 1
branches = 1
reason = "the socket breaking while the replay is written, in the instant between reading x-resume and writing its answer; the write deadline itself is covered by ws_a_slow_consumer_is_disconnected_not_buffered"

[[exclusion]]
crate = "antares-ws"
file = "src/socket.rs"
function = "Session::tick"
lines = 1
branches = 1
reason = "a heartbeat that finds its connection taken over: a resume wakes the old session, whose drain sees the takeover first (covered), so the tick is a backstop for a wake the new session consumed"

[[exclusion]]
crate = "antares-ws"
