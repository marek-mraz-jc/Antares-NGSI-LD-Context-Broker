# Lines and branches of the surfaces epic's new crates that no test covers, and why
# (surfaces-test-plan section 1, dev/coverage-gate.py). One entry per function:
#
# [[exclusion]]
# crate = "antares-ops"                 # the package name
# file = "src/parse.rs"                 # relative to the crate's folder
# function = "antares_ops::parse::depth" # the Rust path of the function
# lines = 1                             # uncovered lines in it
# branches = 1                          # uncovered branch sides in it
# reason = "unreachable after a checked conversion the type system cannot see"
#
# The gate is red when a crate is below 100 % minus what is listed, and when an entry's function
# is gone or its counts differ from what is measured, so a fixed gap must leave this file too.

[[exclusion]]
crate = "antares-ops"
file = "src/lib.rs"
function = "Ops::run" # v0 mangling puts the impl between the crate and the type
lines = 6
branches = 1
reason = "a 503 comes from a store whose pool timed out (DB_OVERLOADED); the built-in store under test_kit has no pool, and the broker's own tests cover the 503 through their pool-wall driver"

[[exclusion]]
crate = "antares-ops"
file = "src/lib.rs"
function = "antares_ops::inner_failure"
lines = 2
branches = 0
reason = "tracing::warn! repeats the fields in its `log` fallback, which runs only with no subscriber set; ops_errors covers the subscriber path and asserts what it logs"

[[exclusion]]
crate = "antares-ops"
file = "src/views.rs"
function = "antares_ops::views::inner"
lines = 8
branches = 0
reason = "the view store failing: the built-in store under test_kit does not fail, and antares-ops may not name the store to put one that does in its place (module rule M2)"

[[exclusion]]
crate = "antares-ops"
file = "src/views/preview.rs"
function = "antares_ops::views::preview::preview"
lines = 2
branches = 0
reason = "the errors of building a request from a query axum already parsed and a tenant the loader validated, and of reading an in-memory body: neither can fail"

[[exclusion]]
crate = "antares-ops"
file = "src/views.rs"
function = "Reloader::reload_or_log" # v0 mangling puts the impl between the crate and the type
lines = 3
branches = 1
reason = "the periodic reload failing on the store, which the built-in store does not (see antares_ops::views::inner)"

[[exclusion]]
crate = "antares-ops"
file = "src/lib.rs"
function = "ViewOps::offered" # v0 mangling puts the impl between the crate and the type
lines = 1
branches = 1
reason = "the view's tenant fails TenantId::new: the loader stores a TenantId's own text (views.rs Loaded), so the fail-closed answer is unreachable after a checked conversion the type system cannot see"

[[exclusion]]
crate = "antares-mcp"
file = "src/server.rs"
function = "Server::run" # v0 mangling puts the impl between the crate and the type
lines = 6
branches = 0
reason = "an inner answer past 32 MiB: every tool asks a bounded page (limit at most 1000, lastN at most 100), so the built-in store cannot produce one without a fixture of that size in every test run"

[[exclusion]]
crate = "antares-mcp"
file = "src/server.rs"
function = "Server::call" # v0 mangling puts the impl between the crate and the type
lines = 5
branches = 0
reason = "tracing::info! repeats the fields in its `log` fallback, which runs only with no subscriber set; tests/mcp_log.rs covers the subscriber path and asserts what it logs"

[[exclusion]]
crate = "antares-mcp"
file = "src/server.rs"
function = "Server::write" # v0 mangling puts the impl between the crate and the type
lines = 2
branches = 1
reason = "a deployment key file that cannot be used: the codec is a process static, so a test run with a working key never reaches the refusal; confirm::codec_of's refusals are unit-tested"
