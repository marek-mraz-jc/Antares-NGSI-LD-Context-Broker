lines = 1
branches = 1
reason = "the operating system refusing randomness: getrandom cannot be made to fail from a test, and the process aborts there by design (an all-zero id would be guessable)"

[[exclusion]]
crate = "antares-ws"
file = "src/hub.rs"
function = "Hub::open"
lines = 1
branches = 1
reason = "two 128-bit random connection ids colliding: the retry loop is the guard, no test can draw a collision"

[[exclusion]]
crate = "antares-ws"
file = "src/hub.rs"
function = "Conn::detach"
lines = 1
branches = 1
reason = "a socket that ends by itself (Gone, a close) in the instant after a resume took its connection over: the resume wakes the old session first, which then always ends as TakenOver (ws_a_resume_takes_over_an_attached_connection covers that path)"

[[exclusion]]
crate = "antares-ws"
file = "src/lib.rs"
function = "antares_ws::upgrade"
lines = 1
branches = 0
reason = "on_failed_upgrade runs when hyper fails the upgrade after the 101 was sent, an I/O failure inside hyper no client request produces"

[[exclusion]]
