# Fuzzing the user-input interpreters — q=, scopeQ,
# geoQ params, and the JSON-LD expansion input path — run under libFuzzer in
# scheduled CI (.github/workflows/fuzz.yml). Not a workspace member.
[package]
name = "antares-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
antares-ql = { path = "../crates/antares-ql" }
antares-api = { path = "../crates/antares-api", default-features = false, features = ["fuzzing"] }
antares-model = { path = "../crates/antares-model" }
antares-jsonld = { path = "../crates/antares-jsonld" }
# q_to_sql: the SQL compilers alone; the Postgres store is not linked.
antares-sql = { path = "../crates/antares-sql", default-features = false }

[[bin]]
name = "parse_q"
path = "fuzz_targets/parse_q.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scope_q"
