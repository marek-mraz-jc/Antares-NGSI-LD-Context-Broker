# The subject proxy of the policy overlay (docker-compose-policy.yml): the context-gateway's part.
# Every request loses the x-jc-* headers it came with and carries the suite's one identity.

global
    maxconn 4096
    # the suite reads Location case-sensitively (haproxy-ha.cfg)
    h1-case-adjust location Location

defaults
    mode http
    option h1-case-adjust-bogus-client
    timeout connect 2s
    timeout client 60s
    timeout server 60s

frontend b1
    bind :9090
    default_backend b1
frontend b2
    bind :9091
    default_backend b2
frontend b3
    bind :9092
    default_backend b3
frontend b4
    bind :9093
    default_backend b4
frontend b5
    bind :9094
    default_backend b5

backend b1
    http-request del-header x-jc- -m beg
    http-request set-header x-jc-client etsi-suite
    server antares1 127.0.0.1:9190
backend b2
    http-request del-header x-jc- -m beg
    http-request set-header x-jc-client etsi-suite
    server antares2 127.0.0.1:9191
backend b3
    http-request del-header x-jc- -m beg
    http-request set-header x-jc-client etsi-suite
    server antares3 127.0.0.1:9192
backend b4
    http-request del-header x-jc- -m beg
    http-request set-header x-jc-client etsi-suite
    server antares4 127.0.0.1:9193
backend b5
    http-request del-header x-jc- -m beg
    http-request set-header x-jc-client etsi-suite
    server antares5 127.0.0.1:9194
