name: ci

# Every push: the five crates build and pass their tests standalone, with the lockfile.
# A v* tag: the same, then a GitHub release carrying the source archive and SLSA build provenance
# for it. Consumers depend on the tag (git = "https://github.com/marek-mraz-jc/ngsild", tag = …).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the GitHub release
      id-token: write # the provenance signature
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag is the crates' version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print({p["name"]: p["version"] for p in json.load(sys.stdin)["packages"]}["ngsild-model"])')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, crates at $version"; exit 1; }
      - name: Source archive
        run: git archive --format=tar.gz --prefix="ngsild-${GITHUB_REF_NAME}/" -o "ngsild-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ngsild-${{ github.ref_name }}.tar.gz
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "ngsild-${GITHUB_REF_NAME}.tar.gz" --title "ngsild $GITHUB_REF_NAME" --notes "From Antares-NGSI-LD-Context-Broker $(cat SOURCE). Verify: gh attestation verify ngsild-${GITHUB_REF_NAME}.tar.gz --repo $GITHUB_REPOSITORY"
