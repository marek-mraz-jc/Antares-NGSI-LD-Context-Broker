name: surfaces-conformance

# The surfaces' conformance jobs (docs/analysis/surfaces-conformance.md
# section 7). This file holds the MCP pair (T-3516) and the OData suite
# (T-3510); the other surfaces add their jobs here.
#
#   mcp-conformance  the official @modelcontextprotocol/conformance 0.1.16
#                    against /x/views/all/mcp, both revisions it knows that
#                    the surface serves, with ci/mcp-baseline.yaml (every
#                    entry has its reason and upstream link)
#   mcp-suites       joinedcontext-conformance tests/mcp (protocol,
#                    isolation, read parity) with MCP_SURFACE=broker, the
#                    platform_only cases deselected; parity under view `all`
#                    and under `parity-restricted`
#   odata-conformance joinedcontext-conformance tests/odata (ABNF cases
#                    live, both $metadata validations, $filter/q parity,
#                    Capabilities, linked-entity checks) against views
#                    `all` and `parity-restricted`
#
# Pull requests to dev run the merge-request subset (both official
# revisions, the parity suite trimmed to MCP_PARITY_CASES=5, the OData ABNF
# and $metadata cases); the nightly run, v* tags and dispatch run
# everything. The broker is the `mcp,odata` build (views + mcp + odata)
# until a `full` feature exists, loaded with ci/views (views, LinkML
# schemas, seed) by dev/views-rig.sh.
on:
  pull_request:
    branches: [dev]
  schedule:
    - cron: "17 2 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: surfaces-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # joinedcontext-conformance (public) at the commit that carries the
  # broker's MCP parity table, the platform_only marker, tests/odata and
  # its client checks
  CONFORMANCE_REF: 4c8b60cfb982459bf1f5c7e4be7522529fc14f59
  NIGHTLY: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build the surfaces broker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: surfaces-conformance
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --locked -p antares-broker --features mcp,odata
      - uses: actions/upload-artifact@v6
        with:
          name: broker-surfaces
          path: target/debug/antares
          retention-days: 1

  mcp-conformance:
    name: mcp-conformance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: broker-surfaces
      - name: Start the broker and load the views
        run: |
          chmod +x antares
          # the scenario dns-rebinding-protection sends the deployment's own
          # origin, which a deployment names here
          ANTARES_HTTP_PORT=8080 ANTARES_API_SURFACES=admin,views,mcp \
            ANTARES_SCHEMA_MAX_BYTES=1048576 \
            ANTARES_MCP_ALLOWED_ORIGINS=http://localhost:8080 ./antares > broker.log 2>&1 &
          for _ in $(seq 1 100); do curl -sf -o /dev/null localhost:8080/q/health && break; sleep 0.2; done
          dev/views-rig.sh http://localhost:8080
      - name: Official MCP conformance, 2025-11-25 and 2025-06-18
        # 0.1.16 knows 2025-03-26, 2025-06-18, 2025-11-25 and draft (no
        # server scenario); the 2026-07-28 era is the crate's own tests
        run: |
          for version in 2025-11-25 2025-06-18; do
            npx --yes @modelcontextprotocol/conformance@0.1.16 server \
              --url http://localhost:8080/x/views/all/mcp --spec-version "$version" \
              --expected-failures ci/mcp-baseline.yaml -o "results/$version"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mcp-conformance
          path: |
            results/
            broker.log
          retention-days: 14
      - name: File an issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/failure-issue
        with:
          title: mcp-conformance went red
          body: The official MCP conformance run against /x/views/all/mcp failed.
          log-file: broker.log

  mcp-suites:
    name: mcp-suites
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: marek-mraz-jc/joinedcontext-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          path: conformance
      - uses: actions/download-artifact@v7
        with:
          name: broker-surfaces
      - name: Install the suites' pinned Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r conformance/requirements.txt
      - name: Start the broker and load the views
        run: |
          chmod +x antares
          ANTARES_HTTP_PORT=8080 ANTARES_API_SURFACES=admin,views,mcp \
            ANTARES_SCHEMA_MAX_BYTES=1048576 ./antares > broker.log 2>&1 &
          for _ in $(seq 1 100); do curl -sf -o /dev/null localhost:8080/q/health && break; sleep 0.2; done
          dev/views-rig.sh http://localhost:8080
      - name: The MCP suites, platform_only deselected
        env:
          MCP_SURFACE: broker
          MCP_URL: http://localhost:8080/x/views/all/mcp
          ENDPOINT_MCP_URL: http://localhost:8080/x/views/all/mcp
          MCP_NARROWED_URL: http://localhost:8080/x/views/parity-restricted/mcp
          OTHER_SPACE_MCP_URL: http://localhost:8080/x/views/other/mcp
          OTHER_SPACE_TYPE: Device
        run: |
          mkdir -p reports
          if [ "$NIGHTLY" = true ]; then
            suites="test_mcp_protocol.py test_mcp_isolation.py test_mcp_read_parity.py"
          else
            suites=test_mcp_read_parity.py
            export MCP_PARITY_CASES=5
          fi
          cd conformance/tests/mcp
          # shellcheck disable=SC2086 # one word per suite file
          ../../../.venv/bin/python -m pytest -q -m "not platform_only" \
            --junitxml=../../../reports/mcp-suites.xml $suites
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mcp-suites
          path: |
            reports/
            broker.log
          retention-days: 14
      - name: File an issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/failure-issue
        with:
          title: mcp-suites went red
          body: The joinedcontext-conformance MCP suites against the broker failed.
          log-file: broker.log

  odata-conformance:
    name: odata-conformance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: marek-mraz-jc/joinedcontext-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          path: conformance
      - uses: actions/download-artifact@v7
        with:
          name: broker-surfaces
      - name: Install the suite's pinned Python and xmllint
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r conformance/requirements.txt
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: Start the broker and load the views
        run: |
          chmod +x antares
          ANTARES_HTTP_PORT=8080 ANTARES_API_SURFACES=admin,views,odata \
            ANTARES_SCHEMA_MAX_BYTES=1048576 ./antares > broker.log 2>&1 &
          for _ in $(seq 1 100); do curl -sf -o /dev/null localhost:8080/q/health && break; sleep 0.2; done
          dev/views-rig.sh http://localhost:8080
      - name: The OData suite, the merge-request subset on pull requests
        env:
          ODATA_URL: http://localhost:8080/x/views/all/odata/v4
          ODATA_RESTRICTED_URL: http://localhost:8080/x/views/parity-restricted/odata/v4
          JC_REPORTS_DIR: reports
        run: |
          export PATH="$PWD/.venv/bin:$PATH"
          if [ "$NIGHTLY" = true ]; then
            conformance/tests/odata/run.sh
          else
            conformance/tests/odata/run.sh -k "abnf or metadata"
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: odata-conformance
          path: |
            reports/
            broker.log
          retention-days: 14
      - name: File an issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/failure-issue
        with:
          title: odata-conformance went red
          body: The joinedcontext-conformance OData suite against /x/views/all/odata/v4 failed.
          log-file: broker.log

  # ADR-0024 decision 7: the two required OData clients read $metadata and
  # one page of view all, then the restricted view without NO2. Nightly.
  odata-clients:
    name: odata-clients-${{ matrix.client }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        client: [dotnet, sap]
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: marek-mraz-jc/joinedcontext-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          path: conformance
      - uses: actions/download-artifact@v7
        with:
          name: broker-surfaces
      - if: matrix.client == 'dotnet'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - if: matrix.client == 'sap'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Start the broker and load the views
        run: |
          chmod +x antares
          ANTARES_HTTP_PORT=8080 ANTARES_API_SURFACES=admin,views,odata \
            ANTARES_SCHEMA_MAX_BYTES=1048576 ./antares > broker.log 2>&1 &
          for _ in $(seq 1 100); do curl -sf -o /dev/null localhost:8080/q/health && break; sleep 0.2; done
          dev/views-rig.sh http://localhost:8080
      - name: The client check
        env:
          ODATA_URL: http://localhost:8080/x/views/all/odata/v4
          ODATA_RESTRICTED_URL: http://localhost:8080/x/views/parity-restricted/odata/v4
        run: conformance/tests/odata/clients/${{ matrix.client }}/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: odata-clients-${{ matrix.client }}
          path: broker.log
          retention-days: 14
      - name: File an issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/failure-issue
        with:
          title: odata-clients-${{ matrix.client }} went red
          body: The ${{ matrix.client }} OData client check against /x/views/all/odata/v4 failed.
          log-file: broker.log
