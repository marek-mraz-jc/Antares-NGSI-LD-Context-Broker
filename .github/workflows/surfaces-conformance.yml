name: surfaces-conformance

# The surfaces' conformance jobs (docs/analysis/surfaces-conformance.md
# section 7). This file holds the MCP pair (T-3516) and etsi-iop (T-3675);
# the other surfaces add their jobs here.
#
#   mcp-conformance  the official @modelcontextprotocol/conformance 0.1.16
#                    against /x/views/all/mcp, both revisions it knows that
#                    the surface serves, with ci/mcp-baseline.yaml (every
#                    entry has its reason and upstream link)
#   mcp-suites       joinedcontext-conformance tests/mcp (protocol,
#                    isolation, read parity) with MCP_SURFACE=broker, the
#                    platform_only cases deselected; parity under view `all`
#                    and under `parity-restricted`
#   etsi-iop         the ETSI IOP suite over five brokers on the
#                    all-features image (mqtt, views, mcp), compared TP by
#                    TP with the vanilla image of the same commit
#                    (dev/etsi-baseline.py compare); not per pull request
#
# Pull requests to dev run the merge-request subset (both official
# revisions, the parity suite trimmed to MCP_PARITY_CASES=5); the nightly
# run, v* tags and dispatch run everything. The broker is the `mcp` build
# (views + mcp) until a `full` feature exists, loaded with ci/views by
# dev/views-rig.sh.
on:
  pull_request:
    branches: [dev]
  schedule:
    - cron: "17 2 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: surfaces-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # joinedcontext-conformance (public) at the commit that carries the
  # broker's parity table and the platform_only marker
  CONFORMANCE_REF: 089ecdb5326ad3f1e9a2b7f8cefa7f1b556ccadc
  NIGHTLY: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    name: Build the mcp broker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: surfaces-conformance
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: cargo build --locked -p antares-broker --features mcp
      - uses: actions/upload-artifact@v6
        with:
          name: broker-mcp
          path: target/debug/antares
          retention-days: 1

  mcp-conformance:
    name: mcp-conformance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: broker-mcp
      - name: Start the broker and load the views
        run: |
          chmod +x antares
          # the scenario dns-rebinding-protection sends the deployment's own
          # origin, which a deployment names here
          ANTARES_HTTP_PORT=8080 ANTARES_API_SURFACES=admin,views,mcp \
            ANTARES_MCP_ALLOWED_ORIGINS=http://localhost:8080 ./antares > broker.log 2>&1 &
          for _ in $(seq 1 100); do curl -sf -o /dev/null localhost:8080/q/health && break; sleep 0.2; done
          dev/views-rig.sh http://localhost:8080
      - name: Official MCP conformance, 2025-11-25 and 2025-06-18
        # 0.1.16 knows 2025-03-26, 2025-06-18, 2025-11-25 and draft (no
        # server scenario); the 2026-07-28 era is the crate's own tests
        run: |
          for version in 2025-11-25 2025-06-18; do
            npx --yes @modelcontextprotocol/conformance@0.1.16 server \
              --url http://localhost:8080/x/views/all/mcp --spec-version "$version" \
              --expected-failures ci/mcp-baseline.yaml -o "results/$version"
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mcp-conformance
          path: |
            results/
            broker.log
          retention-days: 14
      - name: File an issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/failure-issue
        with:
          title: mcp-conformance went red
          body: The official MCP conformance run against /x/views/all/mcp failed.
          log-file: broker.log

  mcp-suites:
    name: mcp-suites
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: marek-mraz-jc/joinedcontext-conformance
          ref: ${{ env.CONFORMANCE_REF }}
          path: conformance
      - uses: actions/download-artifact@v7
        with:
          name: broker-mcp
      - name: Install the suites' pinned Python
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r conformance/requirements.txt
      - name: Start the broker and load the views
        run: |
          chmod +x antares
          ANTARES_HTTP_PORT=8080 ANTARES_API_SURFACES=admin,views,mcp ./antares > broker.log 2>&1 &
          for _ in $(seq 1 100); do curl -sf -o /dev/null localhost:8080/q/health && break; sleep 0.2; done
          dev/views-rig.sh http://localhost:8080
      - name: The MCP suites, platform_only deselected
        env:
          MCP_SURFACE: broker
          MCP_URL: http://localhost:8080/x/views/all/mcp
          ENDPOINT_MCP_URL: http://localhost:8080/x/views/all/mcp
          MCP_NARROWED_URL: http://localhost:8080/x/views/parity-restricted/mcp
          OTHER_SPACE_MCP_URL: http://localhost:8080/x/views/other/mcp
          OTHER_SPACE_TYPE: Device
        run: |
          mkdir -p reports
          if [ "$NIGHTLY" = true ]; then
            suites="test_mcp_protocol.py test_mcp_isolation.py test_mcp_read_parity.py"
          else
            suites=test_mcp_read_parity.py
            export MCP_PARITY_CASES=5
          fi
          cd conformance/tests/mcp
          # shellcheck disable=SC2086 # one word per suite file
          ../../../.venv/bin/python -m pytest -q -m "not platform_only" \
            --junitxml=../../../reports/mcp-suites.xml $suites
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mcp-suites
          path: |
            reports/
            broker.log
          retention-days: 14
      - name: File an issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/failure-issue
        with:
          title: mcp-suites went red
          body: The joinedcontext-conformance MCP suites against the broker failed.
          log-file: broker.log

  # T-3675: the ETSI IOP suite over five brokers (dev/etsi-pipeline.sh,
  # SUITES=IOP) on the all-features image and on the vanilla image of the
  # same commit; red on any TP whose verdict differs. Two release images per
  # run, so nightly, v* tags and dispatch only, never per pull request.
  etsi-iop-run:
    name: etsi-iop ${{ matrix.variant }}
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        variant: [vanilla, full]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OUT: results/iop-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v7
      - name: Build the ${{ matrix.variant }} image
        run: |
          f=""; [ "${{ matrix.variant }}" = full ] && f=mqtt,views,mcp
          docker build --build-arg FEATURES="$f" -t antares-local:latest .
      - name: IOP_TP over five brokers
        env:
          STORE: memory
          SUITES: IOP
          RESULTS_DIR: ${{ env.OUT }}
          SKIP_BUILD: "1"
          STOP_ON_ERROR: "0"
          CALLBACK_HOST: localhost
          API_SURFACES: ${{ matrix.variant == 'full' && 'admin,views,mcp' || 'admin' }}
        run: ./dev/etsi-pipeline.sh || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: etsi-iop-${{ matrix.variant }}
          path: |
            ${{ env.OUT }}/tp-status.csv
            ${{ env.OUT }}/run-summary.md
            ${{ env.OUT }}/failures.csv
            ${{ env.OUT }}/IOP-console.log
            ${{ env.OUT }}/**/log.html
          retention-days: 14

  etsi-iop:
    name: etsi-iop
    needs: etsi-iop-run
    if: always() && needs.etsi-iop-run.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: etsi-iop-*
          path: in
      - name: Full answers as vanilla, TP by TP
        # explicit bash is -eo pipefail: the compare's exit survives the tee
        shell: bash
        run: python3 dev/etsi-baseline.py compare in/etsi-iop-vanilla in/etsi-iop-full | tee iop-compare.txt
      - name: File an issue on nightly failure
        if: failure() && github.event_name == 'schedule'
        uses: ./.github/actions/failure-issue
        with:
          title: etsi-iop went red
          body: The ETSI IOP suite on the all-features build differs from the vanilla build of the same commit.
          log-file: iop-compare.txt
