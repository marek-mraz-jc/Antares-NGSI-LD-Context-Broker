name: vulnerabilities
# T-3834: the jc image this repository publishes (`antares-broker-jc:dev`) and the libraries it
# locks (Cargo.lock, fuzz/Cargo.lock), scanned every day and on demand, so a CVE disclosed after
# a build is named without waiting for a push. image-jc.yml gates each build the same way and
# advisories.yml sweeps cargo-deny weekly; this lane catches what was disclosed since.
# Every HIGH and CRITICAL goes to code scanning (SARIF, one category per target); the job fails on
# a fixable one. An exception is a .trivyignore line with its reason, task and expiry, never a
# lowered severity.
on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulnerabilities
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: image-jc, type: image, ref: "ghcr.io/${{ github.repository_owner }}/antares-broker-jc:dev" }
          - { target: libraries, type: fs, ref: "" }
    env:
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Findings to code scanning
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ matrix.type }}
          image-ref: ${{ matrix.ref }}
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          format: sarif
          output: trivy.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.target }}
      - name: A fixable HIGH or CRITICAL fails the day
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ matrix.type }}
          image-ref: ${{ matrix.ref }}
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
