name: release-crates

# T-3913: the NGSI-LD crates go to crates.io from a v* tag only, through crates.io trusted
# publishing (GitHub OIDC, a token that lives for the job; no registry token in secrets), with
# SLSA build provenance attested for every packaged .crate.
#
# Off until the owner turns it on: crates.io lets a crate trust a workflow only after its first
# version exists, so the first publish of each crate is an owner action (T-3913, blocked @user).
# Then, per crate on crates.io: Settings > Trusted Publishing > this repository, workflow
# `release-crates.yml`, environment `crates-io`; and the repository variable
# NGSILD_CRATES_RELEASE = true. Until then a v* tag (the broker's release) skips this job.
#
# A dry run on a tag, never a publish from a branch: workflow_dispatch on the tag with
# dry_run = true (the default) packages, verifies and attests nothing it would not publish.
#
# Yanking a bad version: README.md "Releasing the NGSI-LD crates".
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: package and verify only; publish nothing
        type: boolean
        default: true

permissions:
  contents: read

env:
  # dependency order; `cargo publish` with several -p publishes them in this order itself
  CRATES: antares-model antares-jsonld antares-ql antares-matcher antares-residual

jobs:
  release:
    if: ${{ vars.NGSILD_CRATES_RELEASE == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write # the crates.io OIDC exchange and the provenance signature
      attestations: write
    steps:
      - name: Only from a v* tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::release-crates runs on a v* tag, not on ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag is the crates' version
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print({p["name"]: p["version"] for p in json.load(sys.stdin)["packages"]}["antares-model"])')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, crates at $version"; exit 1; }
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked $(printf -- '-p %s ' $CRATES)
      - name: Package
        run: cargo package --locked --no-verify $(printf -- '-p %s ' $CRATES)
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: target/package/*.crate
      - uses: rust-lang/crates-io-auth-action@v1
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        id: auth
      - name: cargo publish
        if: ${{ github.event_name == 'push' || !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked $(printf -- '-p %s ' $CRATES)
