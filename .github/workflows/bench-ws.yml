name: bench-ws

# The ADR-0027 section 6 row "WebSocket notification" (T-3626): socket p99 is
# within the HTTP sink's p99 to a local receiver, and an idle connection keeps
# at most 32 KiB. `cargo bench -p antares-ws --bench fanout` five times in ONE
# job on a GitHub-hosted runner (the repository is public: free minutes, and
# the shared host stays unloaded); both channels share each run, so a noisy
# runner slows them alike. Report-only: the numbers go to the summary and the
# task, the row is judged on all five.
#
# Runs when the bench or this file changes on dev, and by hand.

on:
  workflow_dispatch:
  push:
    # dev only: a worker branch's push queued hours of runners ahead of ci.yml (2026-10-10)
    branches: [dev]
    paths:
      - crates/antares-ws/benches/**
      - .github/workflows/bench-ws.yml

permissions:
  contents: read

concurrency:
  group: bench-ws-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the bench
        run: cargo bench --locked -p antares-ws --bench fanout --no-run
      - name: Five runs
        run: |
          set -euo pipefail
          mkdir -p results
          for run in 1 2 3 4 5; do
            cargo bench --locked -q -p antares-ws --bench fanout 2>&1 | tee "results/fanout-$run.txt"
          done
      - name: Summary
        if: always()
        run: |
          {
            echo "## bench-ws fanout @ ${GITHUB_SHA::7} on $(nproc) vCPU, $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2)"
            echo '```'
            grep -hE 'latency over|resident' results/fanout-*.txt || echo "(no results)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-ws-fanout
          path: results
          retention-days: 90
