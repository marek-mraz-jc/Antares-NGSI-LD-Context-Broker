name: xray

# Code structure report and the duplication gate: token clones, structural
# duplicate candidates (rustdoc JSON), dead surface, ratcheted against
# dev/dup-baseline.json. dev/code-xray.sh writes the module graphs, symbol
# index and complexity radar as an artifact; dev/dup-check.sh is the gate
# and runs identically on a laptop.

on:
  pull_request:
    paths: ["crates/**", "Cargo.*", "dev/dup-*", ".github/workflows/xray.yml"]
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dup-gate:
    name: duplication gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          key: xray
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-machete
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Duplication gate
        run: ./dev/dup-check.sh
      - name: Module graph gate
        if: always()
        # bash, so pipefail: through tee the gate's own exit code fails the step (T-4722).
        shell: bash
        run: python3 dev/module-graph.py | tee results/dup/module-graph.txt
      - name: Step summary
        if: always()
        run: |
          {
            echo "## Duplication gate"
            cat results/dup/summary.md
            echo
            echo "## Module graph gate"
            echo '```'
            cat results/dup/module-graph.txt
            echo '```'
            echo
            echo '```'
            head -30 results/dup/clones.txt
            echo '```'
            echo '```'
            head -60 results/dup/signatures.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dup-report
          path: results/dup

  xray:
    name: structure report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          key: xray
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-machete,cargo-modules,cargo-depgraph
      - run: rustup component add rust-analyzer
      - run: python3 -m venv .venv && .venv/bin/pip -q install lizard==1.24.0
      - name: X-ray
        run: ./dev/code-xray.sh
      - name: Step summary
        run: |
          { echo "## Code radar (complexity x churn)"; echo '```'; head -40 results/x-ray/code-radar.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: x-ray
          path: results/x-ray
