name: build-image

# Reusable (workflow_call only): the ONE definition of "build the broker
# image and hand it downstream as an artifact". Extracted from
# five drifting copies. Callers:
#   arch: amd64 — etsi-matrix.yml (feeds the cells), roll-weekly.yml,
#                 k8s-smoke.yml. Tag antares-local:latest, artifact
#                 antares-image (antares-image.tgz inside — downstream
#                 `docker load` and the kind smoke depend on that filename).
#   arch: arm64 — ci.yml and full.yml: the arm64 half of the published
#                 manifest, BUILT never tested (standing decision: every
#                 ETSI/RSS gate runs amd64 only; the arm signal is the
#                 workspace job testing natively on arm). Tag
#                 antares-local:arm64, artifact antares-image-arm64.
# Native-arch runners, no QEMU. cargo-chef in the Dockerfile isolates the
# ~400 dependency crates in their own layer; type=gha persists it between
# runs (default scope for amd64 — unchanged so existing caches survive —
# scope=arm64 for arm), so a source-only commit rebuilds just the
# antares-* crates (~10 min → ~3).

on:
  workflow_call:
    inputs:
      arch:
        description: "amd64 (default) or arm64"
        type: string
        default: amd64

# Builds and uploads an image tarball as an artifact; nothing is
# published from here, so the token only has to read the checkout.
permissions:
  contents: read

jobs:
  build:
    name: Build the ${{ inputs.arch }} image
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.arch == 'arm64' && 'arm64' || 'latest' }}
      ART: ${{ inputs.arch == 'arm64' && 'antares-image-arm64' || 'antares-image' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4
      - uses: dtolnay/rust-toolchain@stable

      # The image is built from the default features; this is the check that
      # they still carry no addon, run before the build rather than after, so
      # a red gate costs no image.
      - name: No addon in the shipped build
        run: ./dev/check-no-addon.sh

      - name: Build antares-local:${{ env.TAG }} (dep layer cached across runs)
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: antares-local:${{ env.TAG }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          load: true
          # The layer cache is read by everything but a release and written
          # only by this repository's own branches: a pull request starts
          # warm and leaves nothing behind, and the image a v* tag publishes
          # is built from the sources alone.
          cache-from: ${{ !startsWith(github.ref, 'refs/tags/') && format('type=gha{0}', inputs.arch == 'arm64' && ',scope=arm64' || '') || '' }}
          cache-to: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && format('type=gha,mode=max{0}', inputs.arch == 'arm64' && ',scope=arm64' || '') || '' }}

      # Rule M3 on the shipped artefact (surfaces-threat-model 9.5 item 3):
      # /antares is stripped, so its symbols say nothing; the package list
      # `cargo auditable` embeds (Dockerfile) does, and no surface, ops or
      # protocol crate may be in it.
      - name: The image's /antares links no surface
        run: |
          cargo install --locked rust-audit-info@0.5.4
          id=$(docker create "antares-local:$TAG")
          docker cp "$id:/antares" ./antares-image-bin
          docker rm "$id"
          ./dev/check-vanilla-symbols.sh --audit-info ./antares-image-bin

      # The shipped binary against the advisory database, from the package
      # list cargo-auditable embeds: what a vulnerable crate in the image
      # looks like even when Cargo.lock has moved on. Same ignore list as
      # workspace.yml's cargo-audit, read from deny.toml.
      - name: cargo audit bin
        run: |
          cargo install --locked cargo-audit@0.22.2
          cargo audit --deny warnings $(python3 dev/advisory-ignores.py) bin ./antares-image-bin

      - name: Export it for the downstream jobs
        run: docker save "antares-local:$TAG" | gzip > "$ART.tgz"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ART }}
          path: ${{ env.ART }}.tgz
          retention-days: 3

      - name: Report image size
        run: |
          echo "## Image built (${{ inputs.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "\`antares-local:$TAG\` — $(docker image inspect "antares-local:$TAG" --format '{{.Size}}' | awk '{printf "%.0f MB uncompressed", $1/1024/1024}'), $(du -m "$ART.tgz" | cut -f1) MB compressed" >> "$GITHUB_STEP_SUMMARY"
