name: image-jc

# The joinedcontext platform's broker image (T-3636): the `full` surfaces,
# the LinkML schema surface the gateway's schema routes forward to (T-3803)
# and the platform's policy engine (`--features full,jc-policy,linkml,parquet,tabular,ical`), published
# as `antares-broker-jc` — never as `antares-broker`, which stays the
# vanilla image full.yml releases. Before anything is pushed, the image
# proves what it carries (its auditable dependency list holds every surface
# and the engine) and that it is still the broker: its plain root on
# `ANTARES_POLICY=allow-all` passes every TP of dev/etsi-baseline.json,
# TP by TP, like a vanilla cell. ship.yml pushes, signs and attests the
# image; this workflow is its nightly ETSI proof.
#
# T-4721 (owner order 2026-10-19): ship.yml builds, checks and publishes the
# jc image on every dev push in minutes. This workflow keeps the long ETSI
# proof of the same image, nightly and on dispatch, and publishes nothing, so
# one workflow alone publishes `antares-broker-jc`. It used to run on:
#   push:
#     branches: [dev]
#     paths: [crates/**, addons/**, Cargo.toml, Cargo.lock, Dockerfile, .github/workflows/image-jc.yml]
# with a publish job behind the ETSI one.
on:
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:

concurrency:
  group: image-jc-${{ github.ref }}
  cancel-in-progress: true

env:
  FEATURES: full,jc-policy,linkml,parquet,tabular,ical
  # what the jc image must carry, by crate name in its auditable list
  CARRIES: antares-views antares-mcp antares-odata antares-ws antares-linkml joinedcontext-policy

jobs:
  build:
    name: Build the jc image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Build with the platform's features
        run: |
          docker build --build-arg FEATURES="$FEATURES" \
            --build-arg VERSION=dev --build-arg REVISION="$GITHUB_SHA" \
            -t antares-local:latest .
      - name: SBOM of the built image (syft reads the cargo-auditable list)
        uses: anchore/sbom-action@v0
        with:
          image: antares-local:latest
          format: spdx-json
          output-file: antares-broker-jc.sbom.spdx.json
          upload-artifact: false
      - name: The image carries every surface and the engine
        run: |
          rc=0
          for crate in $CARRIES; do
            if jq -e --arg c "$crate" '[.packages[].name] | index($c)' \
                 antares-broker-jc.sbom.spdx.json >/dev/null; then
              echo "carries $crate"
            else
              echo "MISSING $crate"; rc=1
            fi
          done
          exit $rc
      # T-3834: the bytes that get pushed carry no HIGH or CRITICAL with a fixed version; an
      # exception is a .trivyignore line with its reason, task and expiry.
      - name: No fixable HIGH or CRITICAL in the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: antares-local:latest
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
      - run: docker save antares-local:latest | gzip > antares-image.tgz
      - uses: actions/upload-artifact@v6
        with:
          name: antares-image-jc
          path: |
            antares-image.tgz
            antares-broker-jc.sbom.spdx.json
          retention-days: 3

  etsi:
    # E3 on the jc image: the plain root with every surface on and the
    # built-in engine selected must equal the vanilla baseline TP by TP.
    name: ETSI on the jc image (allow-all, file)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: antares-image-jc
      - run: docker load < antares-image.tgz
      - name: Run every suite through the one pipeline
        env:
          STORE: file
          RESULTS_DIR: cells/ETSI-cell-file
          SKIP_BUILD: "1"
          STOP_ON_ERROR: "0"
          CALLBACK_HOST: localhost
          API_SURFACES: admin,views,mcp,odata,ws,linkml
        run: ./dev/etsi-pipeline.sh || true
      - name: Per-TP baseline (dev/etsi-baseline.json)
        env:
          STORES: file
        run: ./dev/etsi-baseline.py check cells
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ETSI-jc-file
          path: |
            cells/ETSI-cell-file/run-summary.md
            cells/ETSI-cell-file/failures.csv
            cells/ETSI-cell-file/tp-status.csv
            cells/ETSI-cell-file/**/log.html
          retention-days: 30

  etsi-policy:
    # T-4855: the same image with the platform's engine deciding (ANTARES_POLICY=joinedcontext),
    # the suite behind a subject proxy in the context-gateway's place (dev/etsi-pipeline.sh
    # POLICY=, docs/conformance/suite-edits.md section 5). grant: every clause to the suite in its
    # fixed tenants, which must equal the baseline but for the TPs grant-all.expected lists.
    # restricted: Vehicle reads prohibited; exactly the TPs restricted.expected lists fail, and
    # every refusal is a 403 problem naming no entity.
    name: ETSI on the jc image (joinedcontext ${{ matrix.cell }}, file)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: grant
            suites: ""
          - cell: restricted
            suites: ContextInformation/Consumption
    env:
      OUT: cells/ETSI-cell-file
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: antares-image-jc
      - run: docker load < antares-image.tgz
      - name: Self-check of the refusal reader
        run: python3 -m unittest discover -s ci/policy/etsi
      - name: Run the suites through the subject proxy
        env:
          STORE: file
          RESULTS_DIR: ${{ env.OUT }}
          SKIP_BUILD: "1"
          STOP_ON_ERROR: "0"
          CALLBACK_HOST: localhost
          API_SURFACES: admin,views,mcp,odata,ws,linkml
          POLICY: ci/policy/etsi/${{ matrix.cell }}.json
          SUITES: ${{ matrix.suites }}
        run: ./dev/etsi-pipeline.sh || true
      - name: Per-TP baseline, the listed deviations alone (grant)
        if: matrix.cell == 'grant'
        env:
          STORES: file
          EXPECTED: ci/policy/etsi/grant-all.expected
        run: ./dev/etsi-baseline.py check cells
      - name: Exactly the listed refusals, each a 403 naming no entity (restricted)
        if: matrix.cell == 'restricted'
        run: |
          python3 tests/external/etsi/ratchet.py ci/policy/etsi/restricted.expected "$OUT/tp-status.csv"
          python3 ci/policy/etsi/refusals.py "$OUT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ETSI-jc-policy-${{ matrix.cell }}
          path: |
            ${{ env.OUT }}/run-summary.md
            ${{ env.OUT }}/failures.csv
            ${{ env.OUT }}/tp-status.csv
            ${{ env.OUT }}/**/log.html
          retention-days: 30
