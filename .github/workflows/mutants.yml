name: mutants

# Mutation testing of the decision code (T-3531): antares-ql (q, geo, scope
# filters), antares-matcher (subscription matching) and the policy seam
# (crates/antares-api/src/policy.rs). A mutant the tests do not kill is a
# filter or policy branch nothing pins; dev/mutants-survivors.txt lists the
# ones that carry a written reason, and a survivor outside that list fails
# the run. The list is keyed without line numbers, so an edit above a known
# survivor does not make it new. Weekly and by hand; also when this file or
# the list changes.

on:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * 0"
  push:
    paths:
      - .github/workflows/mutants.yml
      - dev/mutants-survivors.txt

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    name: mutants (${{ matrix.target.name }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: ql
            shards: 6
            args: -p antares-ql
          - name: matcher
            shards: 6
            args: -p antares-matcher
          - name: policy
            shards: 6
            # lib tests plus the policy_* integration files: a mutant only
            # an integration test kills is not a survivor
            args: -p antares-api -f crates/antares-api/src/policy.rs -- --lib --test 'policy_*'
        shard: [0, 1, 2, 3, 4, 5]
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - name: Mutate
        run: |
          set -uo pipefail
          # word splitting of the matrix args is intended
          # shellcheck disable=SC2086
          cargo mutants --no-shuffle --shard ${{ matrix.shard }}/${{ matrix.target.shards }} \
            ${{ matrix.target.args }}
          rc=$?
          # 0 all caught, 2 survivors, 3 timeouts: judged below. Anything
          # else (the unmutated tree fails, a usage error) is the run failing.
          case $rc in 0|2|3) ;; *) exit $rc;; esac
      - name: New survivors
        run: |
          set -euo pipefail
          norm() { sed -E 's/:[0-9]+:[0-9]+:/:/' "$1" | sort -u; }
          touch mutants.out/missed.txt
          norm mutants.out/missed.txt > missed.norm
          grep -v '^#' dev/mutants-survivors.txt | grep -v '^$' | sed -E 's/ +# .*$//' > known.raw || true
          norm known.raw > known.norm
          comm -23 missed.norm known.norm > new.txt
          { echo "### ${{ matrix.target.name }} shard ${{ matrix.shard }}"
            echo "caught $(wc -l < mutants.out/caught.txt 2>/dev/null || echo 0), missed $(wc -l < missed.norm), new $(wc -l < new.txt)"
            echo '```'; cat new.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ -s new.txt ]; then
            echo "::error::$(wc -l < new.txt) surviving mutant(s) not in dev/mutants-survivors.txt: write a test, or add the line with a reason"
            cat new.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mutants-${{ matrix.target.name }}-${{ matrix.shard }}
          path: mutants.out
          retention-days: 30
